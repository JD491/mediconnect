<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · MediConnect</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eff6ff, #ffffff 45%, #ecfeff); color: #0f2340; padding: 24px;
    }
    main { max-width: 420px; text-align: center; background: rgba(255,255,255,.82); border: 1px solid #dbeafe;
      border-radius: 24px; padding: 32px 24px; box-shadow: 0 18px 60px rgba(23,62,147,.12); }
    img { height: 56px; width: auto; margin-bottom: 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #5b7088; font-size: .92rem; line-height: 1.55; margin: 0 0 18px; }
    a, button { display: inline-block; border: 0; cursor: pointer; text-decoration: none; font-weight: 800; font-size: .9rem;
      background: #173e93; color: white; padding: 11px 18px; border-radius: 12px; }
    .hint { margin-top: 16px; font-size: .75rem; color: #8a9bb0; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/mediconnect-icon.png" alt="MediConnect" />
    <h1>You’re offline</h1>
    <p>Pages you already visited are still available. Reconnect to refresh stock, prices, appointments and payments.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint">Emergency numbers still work from your phone’s dialer: 112 / 108.</p>
  </main>
</body>
</html>
