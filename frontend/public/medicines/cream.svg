    <rect x="130" y="116" width="140" height="116" rx="26" fill="url(#jar)" stroke="#b9d3ea" stroke-width="2"/>
    <rect x="146" y="142" width="108" height="64" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="160" y="156" width="80" height="9" rx="4.5" fill="#0f766e"/>
    <rect x="160" y="173" width="56" height="6" rx="3" fill="#94a3b8"/>
    <rect x="160" y="185" width="68" height="6" rx="3" fill="#94a3b8"/>
    <rect x="140" y="126" width="16" height="96" rx="8" fill="#ffffff" opacity="0.3"/>
  </g>
  <g fill="#8ab4d8" opacity="0.55">
    <circle cx="86" cy="88" r="5"/><circle cx="320" cy="82" r="7"/><circle cx="316" cy="228" r="4"/><circle cx="80" cy="218" r="6"/>
