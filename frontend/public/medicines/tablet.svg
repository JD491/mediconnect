<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Tablet medicine illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef9ff"/><stop offset="1" stop-color="#d9ecfa"/>
    </linearGradient>
    <radialGradient id="pill" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.65" stop-color="#f2f7fd"/><stop offset="1" stop-color="#cfe1f2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f2340" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="112" fill="#ffffff" opacity="0.4"/>
  <g filter="url(#shadow)">
    <g transform="translate(158 128) rotate(-18)">
      <circle r="58" fill="url(#pill)"/>
      <circle r="58" fill="none" stroke="#b9d3ea" stroke-width="2"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#c3d8ea" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-18" cy="-24" rx="16" ry="10" fill="#ffffff" opacity="0.8"/>
    </g>
    <g transform="translate(250 190) rotate(14)">
      <circle r="42" fill="url(#pill)"/>
      <circle r="42" fill="none" stroke="#b9d3ea" stroke-width="2"/>
      <ellipse cx="-13" cy="-18" rx="11" ry="7" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>
  <g fill="#8ab4d8" opacity="0.55">
    <circle cx="92" cy="82" r="5"/><circle cx="318" cy="76" r="7"/><circle cx="326" cy="220" r="4"/><circle cx="76" cy="214" r="6"/>
  </g>
</svg>
